<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Launcher</title>
<link rel="icon" type="image/png" href="images/maze.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Outfit:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --bg1:#0a0e27;
    --bg2:#050816;
    --accent1:#7C3AED;
    --accent2:#06b6d4;
    --text:#e6eef8;
    --text-secondary:#94a3b8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background: radial-gradient(circle at 30% 20%, rgba(124,58,237,0.18) 0%, transparent 55%),
                radial-gradient(circle at 75% 80%, rgba(6,182,212,0.14) 0%, transparent 55%),
                linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--text);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .grid-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.035;
    background-image:
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .wrap{
    position: relative;
    z-index: 2;
    width: min(440px, 90vw);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .logo{
    width: 92px;
    height: 92px;
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 12px 40px rgba(124,58,237,0.35), 0 0 0 1px rgba(255,255,255,0.06);
  }

  h1{
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #06b6d4, #7C3AED);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tag{
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .download-btn{
    position: relative;
    width: 100%;
    padding: 24px;
    background: linear-gradient(135deg, #7C3AED, #06b6d4);
    background-size: 200% 200%;
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 22px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 10px 40px rgba(124,58,237,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-position 0.4s ease;
    animation: pulse 2.4s ease-in-out infinite;
  }

  .download-btn:hover{
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 16px 50px rgba(124,58,237,0.6);
    background-position: 100% 0;
  }

  .download-btn:active{
    transform: translateY(-1px) scale(0.99);
  }

  .download-btn i{ font-size: 24px; }

  @keyframes pulse{
    0%, 100% { box-shadow: 0 10px 40px rgba(124,58,237,0.45); }
    50% { box-shadow: 0 10px 55px rgba(6,182,212,0.55); }
  }

  .footer{
    font-size: 11px;
    color: rgba(230,238,248,0.3);
    letter-spacing: 0.5px;
  }

  .footer strong{
    color: rgba(230,238,248,0.55);
    font-weight: 600;
  }

  @media (max-width: 480px){
    h1{ font-size: 34px; }
    .download-btn{ font-size: 18px; padding: 20px; }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="wrap">
    <img src="images/maze.png" alt="Maze Launcher" class="logo">
    <div>
      <h1>Maze Launcher</h1>
      <div class="tag">play.mazenw.com.tr</div>
    </div>

    <a href="https://mazenw.com.tr/download/download.html" class="download-btn" target="_blank">
      <i class="fas fa-download"></i>
      İNDİR
    </a>

    <div class="footer">
      <i class="fas fa-heart" style="color:#f59e0b;"></i> Developed by <strong>iMekens & Lunax</strong>
    </div>
  </div>
</body>
</html>
