<html lang="tr">
<head>
<style>body {transition: opacity ease-in 0.2s; } 
body[unresolved] {opacity: 0; display: block; overflow: hidden; position: relative; } 
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Launcher</title>
<link rel="icon" type="image/png" href="images/maze.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --bg1:#0a0e27;
    --bg2:#050816;
    --accent1:#7C3AED;
    --accent2:#06b6d4;
    --accent3:#f59e0b;
    --success:#10b981;
    --danger:#ef4444;
    --glass-border: rgba(255,255,255,0.1);
    --text: #e6eef8;
    --text-secondary: #94a3b8;
    --card-bg: rgba(15,23,42,0.7);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,body{
    height:100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body{
    background: linear-gradient(135deg, #0a0e27 0%, #050816 100%);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(124,58,237,0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: 
      linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .main-container {
    position: relative;
    z-index: 2;
    width: min(500px, 92%);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    position: relative;
    border-radius: 20px;
    background: rgba(15,23,42,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    padding: 36px;
    backdrop-filter: blur(20px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .logo-container {
    flex: 0 0 64px;
    height: 64px;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .title-section {
    flex: 1;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 36px;
    background: linear-gradient(135deg, #06b6d4, #7C3AED);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .server-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 13px;
  }

  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-indicator.online {
    background: #10b981;
    box-shadow: 0 0 8px rgba(16,185,129,0.5);
  }

  .status-indicator.offline {
    background: #ef4444;
    box-shadow: 0 0 8px rgba(239,68,68,0.5);
  }

  .status-indicator.loading {
    background: #f59e0b;
    box-shadow: 0 0 8px rgba(245,158,11,0.5);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 28px 0;
  }

  .stat-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: background 0.2s ease;
  }

  .stat-item:hover {
    background: rgba(124,58,237,0.08);
  }

  .stat-icon {
    font-size: 18px;
    margin-bottom: 6px;
    color: var(--accent1);
  }

  .stat-value {
    font-size: 24px;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--accent1));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  .launch-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #7C3AED, #6d28d9);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-decoration: none;
    display: block;
    text-align: center;
    box-shadow: 0 4px 16px rgba(124,58,237,0.3);
  }

  .launch-btn:hover {
    background: linear-gradient(135deg, #8b5cf6, #7C3AED);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(124,58,237,0.4);
  }

  .launch-btn i {
    margin-right: 8px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(230,238,248,0.35);
    background: rgba(0,0,0,0.3); 
    padding: 10px 18px; 
    border-radius: 10px; 
    border: 1px solid rgba(255,255,255,0.04);
    width: fit-content;
    margin: 0 auto;
  }

  .footer i {
    color: var(--accent3);
    margin: 0 3px;
  }

  .footer strong {
    color: rgba(230,238,248,0.7);
    font-weight: 600;
  }

  @media (max-width: 640px) {
    .card {
      padding: 24px;
    }
    
    h1 {
      font-size: 28px;
    }
    
    .stats {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .stat-item {
      padding: 10px 6px;
    }
    
    .stat-value {
      font-size: 20px;
    }
    
    .header {
      flex-direction: column;
      text-align: center;
    }
    
    .logo-container {
      flex: 0 0 52px;
      height: 52px;
    }
    
    .logo {
      width: 52px;
      height: 52px;
    }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="main-container">
    <div class="card">
      <div class="header">
        <div class="logo-container">
          <img src="images/maze.png" alt="Maze Launcher Logo" class="logo">
        </div>
        <div class="title-section">
          <h1>Maze Launcher</h1>
          <div class="subtitle">play.mazenw.com.tr</div>
          <div class="server-status">
            <span class="status-indicator loading" id="statusIndicator"></span>
            <span id="statusText" style="color: var(--text-secondary); font-size: 12px;">Kontrol ediliyor...</span>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-icon">
            <i class="fas fa-users"></i>
          </div>
          <div class="stat-value" id="playerCount">---</div>
          <div class="stat-label">Oyuncu</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <i class="fas fa-server"></i>
          </div>
          <div class="stat-value" id="maxPlayers">1337</div>
          <div class="stat-label">Max</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <i class="fas fa-code-branch"></i>
          </div>
          <div class="stat-value" id="version">1.8.9</div>
          <div class="stat-label">Sürüm</div>
        </div>
      </div>

      <a href="https://mazenw.com.tr" class="launch-btn" target="_blank">
        <i class="fas fa-play"></i>
        Siteye Git
      </a>
    </div>

    <div class="footer">
      <i class="fas fa-code"></i> Developed by <strong>iMekens & Lunax</strong> <i class="fas fa-heart"></i>
    </div>
  </div>

  <script>
    async function fetchServerStatus() {
      try {
        const response = await fetch('https://api.mcsrvstat.us/2/play.mazenw.com.tr:25565');
        
        if (!response.ok) throw new Error('API error');
        
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error('Sunucu bilgisi alınamadı:', error);
        showOfflineStatus();
      }
    }

    function updateUI(data) {
      const statusIndicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('statusText');
      const playerCount = document.getElementById('playerCount');
      const maxPlayers = document.getElementById('maxPlayers');
      const version = document.getElementById('version');
      
      if (data.online) {
        statusIndicator.className = 'status-indicator online';
        statusText.textContent = 'Çevrimiçi';
        statusText.style.color = '#10b981';
        
        playerCount.textContent = data.players?.online || 0;
        maxPlayers.textContent = 1337;
        
        if (data.version) {
          version.textContent = data.version.split(' ')[0] || '1.8.9';
        }
      } else {
        showOfflineStatus();
      }
    }

    function showOfflineStatus() {
      document.getElementById('statusIndicator').className = 'status-indicator offline';
      document.getElementById('statusText').textContent = 'Çevrimdışı';
      document.getElementById('statusText').style.color = '#ef4444';
      document.getElementById('playerCount').textContent = '0';
      document.getElementById('maxPlayers').textContent = '1337';
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchServerStatus();
      setInterval(fetchServerStatus, 60000);
    });
  </script>
</body>
</html>
